 }
};
const KEY = "u54-why1789-v1";
const STAGES = ["g"].concat(C.waves.map(w => w.id));   // g, w1..w5
const NTAB = STAGES.length + 2;                          // start + stages + results
const RES = NTAB - 1;
let store = { p:{}, a:{}, reached:0, view:0 };
function load() { try { const t = localStorage.getItem(KEY); if (t) store = Object.assign(store, JSON.parse(t)); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function stageOfTab(i) { return i >= 1 && i <= STAGES.length ? STAGES[i - 1] : null; }
function prevStage(st) { const k = STAGES.indexOf(st); return k > 0 ? STAGES[k - 1] : null; }
function pts(st) {
  if (!store.p[st]) {
    const pr = prevStage(st);
    store.p[st] = {};
    C.causes.forEach(c => store.p[st][c.id] = pr && store.p[pr] ? store.p[pr][c.id] : 20);
  }
  return store.p[st];
}
function total(st) { const p = store.p[st]; if (!p) return null; return C.causes.reduce((s, c) => s + (+p[c.id] || 0), 0); }
function reasonId(st) { return st + "r"; }

/* ---------- build panels ---------- */
function sourceHTML(s) {
  let body = "";
  if (s.text) body += `<div class="txt">${s.text.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
  if (s.table) {
    body += `<table><thead><tr>${s.table[0].map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${s.table.slice(1).map(r => `<tr>${r.map((c, j) => j === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  if (s.chart) {
    const max = 16, W = 420, H = 150, bw = 80;
    const bars = s.chart.map((d, k) => { const h = d[1] / max * 100, x = 50 + k * 120; return `<rect x="${x}" y="${120 - h}" width="${bw}" height="${h}" fill="#c0761f"></rect><text x="${x + bw / 2}" y="${114 - h}" text-anchor="middle" font-size="13" font-weight="700" fill="#23303d">${d[1]} sous</text><text x="${x + bw / 2}" y="138" text-anchor="middle" font-size="12.5" fill="#4a5866">${esc(d[0])}</text>`; }).join("");
    body += `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of bread prices: ${s.chart.map(d => d[0] + " " + d[1] + " sous").join(", ")}"><line x1="40" y1="120" x2="${W - 10}" y2="120" stroke="#c8cfd6"></line>${bars}</svg></div>`;
  }
  if (s.after) body += `<div class="after">${esc(s.after)}</div>`;
  if (s.gloss) body += `<div class="gloss">${esc(s.gloss)}</div>`;
  const wide = s.table && s.table[0].length > 3 || s.label === "5A";
  return `<div class="source ${wide ? "wide" : ""}"><div class="lab">Source ${esc(s.label)}</div><div class="ttl">${esc(s.title)}</div><div class="cite">${esc(s.cite)}</div>${body}</div>`;
}
function weighHTML(st, first) {
  const rows = C.causes.map(c => `<div class="crow" style="--c:${c.color}">
      <div class="nm">${esc(c.long)}<small>${esc(c.kind)}</small></div>
      <button data-adj="${st}|${c.id}|-5" aria-label="Take 5 points from ${esc(c.name)}">&minus;</button>
      <input type="number" min="0" max="100" step="5" data-pt="${st}|${c.id}" aria-label="Points for ${esc(c.name)}">
      <button data-adj="${st}|${c.id}|5" aria-label="Add 5 points to ${esc(c.name)}">+</button>
      <div class="trk" aria-hidden="true"><div class="fil" id="fil_${st}_${c.id}"></div></div>
      <div class="was" id="was_${st}_${c.id}"></div>
    </div>`).join("");
  return `<div class="weigh"><h3>${first ? "Make your first prediction" : "Weigh the causes again"}</h3>
    <div class="hint">${first ? "Split 100 points across the five causes, based only on what you know right now. More points means a bigger cause." : "Move points if this wave changed your mind. It is fine to leave them where they are, but you still have to explain why."} Points must add up to exactly 100.</div>
    ${rows}<div class="total" id="tot_${st}" aria-live="polite"></div></div>`;
}
function copyBlock(id, label) {
  return `<div class="row"><button class="btn brass" data-copy="${id}" aria-label="${esc(label)}">${esc(label)}</button><span class="status" id="st${id}"></span></div>
    <div class="fallback" id="fb${id}" aria-label="Your work to copy"></div>`;
}
function nextBlock(i) {
  const label = i + 1 === RES ? "Next: See your results" : `Next: ${tabLabel(i + 1)}`;
  return `<div class="next"><span class="gate" id="gate${i}"></span><button class="btn" data-go="${i + 1}" id="next${i}">${esc(label)}</button></div>`;
}
function buildPanels() {
  const m = document.getElementById("main");
  let h = `<section class="panel intro" data-i="0">
    <div class="year">Before you start</div><h2>What caused the French Revolution?</h2>
    <p>Historians agree on a list of causes. They argue about which ones mattered most. Today you will make that call yourself, and you will change your mind as the evidence comes in.</p>
    <ul>
      <li><b>First,</b> split 100 points across five causes based on what you already know.</li>
      <li><b>Then work through five waves of evidence.</b> Each wave has a short context and real sources. After each wave, move your points if the evidence changed your mind, explain what you moved and why, and answer one sourcing question.</li>
      <li><b>Type your answers.</b> Pasting into the answer boxes is turned off.</li>
      <li><b>At the end of each tab,</b> press the copy button and paste into that tab's box in your Google Doc.</li>
      <li><b>The last tab</b> shows how your thinking changed. Then you will write the exit ticket in your Google Doc.</li>
    </ul>
    <p><b>Guiding question:</b> Which mattered more in 1789, long-term problems or short-term crises?</p>
    <div class="next"><button class="btn" data-go="1">Start: Make your first prediction</button></div></section>`;
  // first guess
  h += `<section class="panel" data-i="1"><div class="year">Step 1</div><h2>Your first prediction</h2>
    <p>The AP course description sums up the causes of the French Revolution in one sentence:</p>
    <div class="kc">${esc(C.kc)}</div>
    <p>That sentence names five causes. Here they are in plain language:</p>
    <ul>${C.causes.map(c => `<li><b>${esc(c.long)}</b> (${esc(c.kind)})</li>`).join("")}</ul>
    ${weighHTML("g", true)}
    <div class="qs"><div class="q"><label for="gr">Why did you give your top cause the most points? Use anything you already know from class or your reading.</label><textarea id="gr" data-a="gr"></textarea></div></div>
    ${copyBlock("g", "Copy my first prediction")}${nextBlock(1)}</section>`;
  C.waves.forEach((w, k) => {
    const i = k + 2;
    h += `<section class="panel" data-i="${i}"><div class="year">Wave ${k + 1} of ${C.waves.length}</div><h2>${esc(w.short)}</h2>
      <div class="context">${w.context.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="sources">${w.sources.map(sourceHTML).join("")}</div>
      ${weighHTML(w.id, false)}
      <div class="qs">
        <div class="q"><label for="${w.id}r">What did you move, and why? Name at least one source by its label (for example, ${esc(w.sources[0].label)}). If you moved nothing, explain why this evidence did not change your mind.</label><textarea id="${w.id}r" data-a="${w.id}r"></textarea></div>
        <div class="q"><label for="${w.sourcing.id}">Sourcing question: ${esc(w.sourcing.q)}</label><textarea id="${w.sourcing.id}" data-a="${w.sourcing.id}"></textarea></div>
      </div>
      ${copyBlock(w.id, "Copy my work for this wave")}${nextBlock(i)}</section>`;
  });
  h += `<section class="panel" data-i="${RES}"><div class="year">Results</div><h2>How your thinking changed</h2>
    <p>Each line shows one cause. Follow it from your first prediction to your final weighting.</p>
    <div class="chartbox"><div id="lineChart"></div><div class="legend">${C.causes.map(c => `<span style="--c:${c.color}">${esc(c.long)}</span>`).join("")}</div></div>
    <h3 style="margin-top:14px">Your final weighting</h3><div class="rank" id="rank"></div>
    <div class="qs"><div class="q"><label for="resr">Look at your chart. Which cause changed the most from your first prediction to the end, and what evidence changed it?</label><textarea id="resr" data-a="resr"></textarea></div></div>
    ${copyBlock("res", "Copy my results")}
    <div class="final"><h3>Now write your exit ticket</h3>
      <p>Paste your results into the Results box in your Google Doc. Then open the <b>Summative Exit Ticket</b> tab and complete it there. You will compare two sources from today (the village cahier, 1C, and Tocqueville, 5B) and defend your top cause with evidence from two different waves.</p></div>
    </section>`;
  m.innerHTML = h;
}

/* ---------- points ---------- */
function renderPts(st) {
  const p = pts(st), pr = prevStage(st);
  C.causes.forEach(c => {
    const inp = document.querySelector(`[data-pt="${st}|${c.id}"]`); if (!inp) return;
    if (document.activeElement !== inp) inp.value = p[c.id];
    document.getElementById(`fil_${st}_${c.id}`).style.width = Math.min(100, p[c.id]) + "%";
    const was = document.getElementById(`was_${st}_${c.id}`);
    if (pr && store.p[pr]) { const d = p[c.id] - store.p[pr][c.id]; was.textContent = d === 0 ? `was ${store.p[pr][c.id]}` : `was ${store.p[pr][c.id]} (${d > 0 ? "+" : ""}${d})`; }
  });
  const t = total(st), el = document.getElementById("tot_" + st);
  el.textContent = t === 100 ? "Total: 100. Ready." : `Total: ${t}. ${t > 100 ? "Take away " + (t - 100) : "Add " + (100 - t)} to reach 100.`;
  el.className = "total " + (t === 100 ? "good" : "bad");
  updateGate();
}
function setPt(st, id, v) { v = Math.max(0, Math.min(100, Math.round(+v || 0))); pts(st)[id] = v; save(); renderPts(st); renderTabs(); }

/* ---------- gating ---------- */
function stageDone(st) { return total(st) === 100 && (store.a[reasonId(st)] || "").trim().length >= 15; }
function tabDone(i) { const st = stageOfTab(i); if (!st) return false; const w = C.waves.find(x => x.id === st); return stageDone(st) && (!w || (store.a[w.sourcing.id] || "").trim().length > 0); }
function updateGate() {
  for (let i = 1; i <= STAGES.length; i++) {
    const b = document.getElementById("next" + i), g = document.getElementById("gate" + i); if (!b) continue;
    const st = stageOfTab(i), w = C.waves.find(x => x.id === st);
    let msg = "";
    if (total(st) !== 100) msg = "Your points must total 100.";
    else if ((store.a[reasonId(st)] || "").trim().length < 15) msg = "Explain what you moved and why.";
    else if (w && !(store.a[w.sourcing.id] || "").trim()) msg = "Answer the sourcing question.";
    b.disabled = !!msg; g.textContent = msg;
  }
}
function tabLabel(i) { if (i === 0) return "Start"; if (i === 1) return "First prediction"; if (i === RES) return "Results"; return C.waves[i - 2].tab; }
function renderTabs() {
  const t = document.getElementById("tabs");
  if (t.children.length !== NTAB) { const out = []; for (let i = 0; i < NTAB; i++) out.push(`<button data-tab="${i}" aria-label="${esc(tabLabel(i))}">${esc(tabLabel(i))}</button>`); t.innerHTML = out.join(""); }
  [...t.children].forEach((b, i) => { b.classList.toggle("active", i === store.view); b.classList.toggle("done", tabDone(i)); b.disabled = i > store.reached; });
}
function show(i) {
  if (i > store.reached) store.reached = i;
  store.view = i;
  const st = stageOfTab(i); if (st) { pts(st); renderPts(st); }
  save(); renderTabs();
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", +p.dataset.i === i));
  if (i === RES) renderResults();
  window.scrollTo(0, 0);
}

/* ---------- results ---------- */
function renderResults() {
  const W = 680, H = 300, L = 44, Rr = 20, T = 16, B = 40, n = STAGES.length;
  const x = k => L + k * (W - L - Rr) / (n - 1), y = v => T + (1 - v / 100) * (H - T - B);
  let g = "";
  [0, 25, 50, 75, 100].forEach(v => { g += `<line x1="${L}" y1="${y(v)}" x2="${W - Rr}" y2="${y(v)}" stroke="#e3e7eb"></line><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#4a5866">${v}</text>`; });
  STAGES.forEach((st, k) => { g += `<text x="${x(k)}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#4a5866">${k === 0 ? "First guess" : "Wave " + k}</text>`; });
  C.causes.forEach(c => {
    const vals = STAGES.map(st => (store.p[st] || {})[c.id]);
    const ptsStr = vals.map((v, k) => v === undefined ? null : `${x(k)},${y(v)}`).filter(Boolean).join(" ");
    g += `<polyline points="${ptsStr}" fill="none" stroke="${c.color}" stroke-width="3"></polyline>`;
    vals.forEach((v, k) => { if (v !== undefined) g += `<circle cx="${x(k)}" cy="${y(v)}" r="4.5" fill="${c.color}"></circle>`; });
  });
  const summary = C.causes.map(c => `${c.name}: ${STAGES.map(st => (store.p[st] || {})[c.id] ?? "-").join(", ")}`).join("; ");
  document.getElementById("lineChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of your points by stage. ${esc(summary)}">${g}</svg>`;
  const last = store.p[STAGES[n - 1]] || pts(STAGES[n - 1]);
  const sorted = C.causes.slice().sort((a, b) => last[b.id] - last[a.id]);
  document.getElementById("rank").innerHTML = sorted.map(c => `<div class="r" style="--c:${c.color}"><div class="l">${esc(c.long)}</div><div class="t"><div class="f" style="width:${Math.max(last[c.id], 4)}%">${last[c.id]}</div></div></div>`).join("");
}

/* ---------- copy ---------- */
function ptsLine(st) {
  const p = pts(st), pr = prevStage(st);
  return C.causes.map(c => { const d = pr && store.p[pr] ? p[c.id] - store.p[pr][c.id] : null; return `${c.long}: ${p[c.id]}${d === null || d === 0 ? "" : ` (${d > 0 ? "+" : ""}${d})`}`; }).join("\n");
}
function ans(id) { return (store.a[id] || "").trim() || "(no answer yet)"; }
function L(label, answer) { return { label, answer: String(answer ?? "").trim() || "(no answer yet)" }; }
function ptsLines(st) {
  const p = pts(st), pr = prevStage(st);
  return C.causes.map(c => { const d = pr && store.p[pr] ? p[c.id] - store.p[pr][c.id] : null; return L(c.long + ": ", `${p[c.id]}${d === null || d === 0 ? "" : ` (${d > 0 ? "+" : ""}${d})`}`); });
}
function buildCopy(which) {
  let out = [];
  if (which === "g") {
    out.push({ head: "FIRST PREDICTION" }, { label: "My points:" }, ...ptsLines("g"), L("Why my top cause got the most points: ", store.a.gr));
  } else if (which === "res") {
    out.push({ head: "MY RESULTS" }, { label: "Cause: " + STAGES.map((s, k) => k === 0 ? "First guess" : "Wave " + k).join(" | ") });
    C.causes.forEach(c => out.push(L(c.long + ": ", STAGES.map(st => (store.p[st] || {})[c.id] ?? "-").join(" | "))));
    out.push(L("Which cause changed the most, and why: ", store.a.resr));
  } else {
    const k = C.waves.findIndex(w => w.id === which), w = C.waves[k];
    out.push({ head: `WAVE ${k + 1}: ${w.short.toUpperCase()}` }, { label: "My points (change from last wave):" }, ...ptsLines(w.id),
      L("What I moved and why: ", store.a[w.id + "r"]), L("Sourcing question: " + w.sourcing.q + " ", store.a[w.sourcing.id]));
  }
  const html = out.map(o => o.head ? `<p><u>${esc(o.head)}</u></p>` : o.answer === undefined ? `<p>${esc(o.label)}</p>` : `<p>${esc(o.label)}<b>${esc(o.answer).replace(/\n/g, "<br>")}</b></p>`).join("");
  const text = out.map(o => o.head || (o.label + (o.answer === undefined ? "" : o.answer))).join("\n");
  return { html, text };
}
function copyOut(which) {
  const { html, text } = buildCopy(which);
  const status = document.getElementById("st" + which), box = document.getElementById("fb" + which);
  function ok() { status.textContent = "Copied. Paste into your doc."; setTimeout(() => status.textContent = "", 4000); }
  function tryExec() {
    let done = false;
    const h = e => { try { e.clipboardData.setData("text/html", html); e.clipboardData.setData("text/plain", text); e.preventDefault(); done = true; } catch (err) {} };
    document.addEventListener("copy", h, { once: true });
    try { document.execCommand("copy"); } catch (e) {}
    document.removeEventListener("copy", h);
    if (done) ok();
    return done;
  }
  function manual() {
    box.innerHTML = `<div style="font-size:13px;font-weight:600">Select everything in this box and copy it (Cmd+C or Ctrl+C), then paste into your doc.</div><div class="copyarea">${html}</div>`;
    box.classList.add("visible");
    const r = document.createRange(); r.selectNodeContents(box.querySelector(".copyarea"));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    status.textContent = "Select and copy below.";
  }
  if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
    try {
      const item = new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) });
      navigator.clipboard.write([item]).then(ok).catch(() => { if (!tryExec()) manual(); });
    } catch (e) { if (!tryExec()) manual(); }
  } else if (!tryExec()) manual();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab !== undefined) { show(+b.dataset.tab); return; }
  if (b.dataset.go !== undefined) { if (!b.disabled) show(+b.dataset.go); return; }
  if (b.dataset.adj !== undefined) { const [st, id, d] = b.dataset.adj.split("|"); setPt(st, id, pts(st)[id] + +d); return; }
  if (b.dataset.copy !== undefined) { copyOut(b.dataset.copy); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.pt) { const [st, id] = t.dataset.pt.split("|"); setPt(st, id, t.value); return; }
  if (t.dataset.a) { store.a[t.dataset.a] = t.value; save(); updateGate(); renderTabs(); }
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset.pt) { const [st] = t.dataset.pt.split("|"); renderPts(st); } });
/* ---------- no pasting: students must type ---------- */
function blockPaste(e) {
  const t = e.target;
  if (!t || !t.dataset || !t.dataset.a) return;
  e.preventDefault();
  let n = t.parentElement.querySelector(".nopaste");
  if (!n) { n = document.createElement("div"); n.className = "nopaste"; n.setAttribute("role", "status"); t.parentElement.appendChild(n); }
  n.textContent = "Pasting is turned off. Type your answer in your own words.";
  clearTimeout(n._t); n._t = setTimeout(() => n.textContent = "", 4000);
}
["paste", "drop"].forEach(ev => document.addEventListener(ev, blockPaste, true));
document.addEventListener("beforeinput", e => { if (e.inputType && /^insertFrom(Paste|Drop)/.test(e.inputType)) blockPaste(e); }, true);
let armed = false;
document.getElementById("clearBtn").addEventListener("click", () => {
  const m = document.getElementById("clearMsg");
  if (!armed) { armed = true; m.textContent = "Press again to erase everything on this computer."; setTimeout(() => { armed = false; m.textContent = ""; }, 5000); return; }
  armed = false; m.textContent = "Cleared."; store = { p:{}, a:{}, reached:0, view:0 }; save();
  document.querySelectorAll("[data-a]").forEach(el => el.value = ""); show(0);
});

load(); buildPanels();
document.querySelectorAll("[data-a]").forEach(el => { if (store.a[el.dataset.a] !== undefined) el.value = store.a[el.dataset.a]; });
show(Math.min(store.view, store.reached));
</script>
</body>
</html>
